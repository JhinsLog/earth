# Earth 백엔드 스택. 프론트엔드는 Cloudflare Pages가 서빙하므로 여기 없다.
#
#   earth.jhinslog.com      → Cloudflare Pages (정적, 홈서버와 무관)
#   earth-api.jhinslog.com  → Cloudflare Tunnel → 이 스택의 earth-backend
#
# 다른 서버로 옮길 때는 이 파일 + monitoring/ + .env + 볼륨만 가져가면 된다.
#
# 사전 준비 (개발 PC에서):
#   cd backend && ./gradlew bootJar   →   backend/build/libs/earth-backend-*.jar
# 산출물을 서버에 올린 뒤:
#   docker compose up -d --build
name: earth

services:
  postgres:
    # PostGIS 포함 이미지. 국가 판정(국경 폴리곤)에 공간 함수가 필요하다.
    # 공식 postgres:17-alpine 위에 PostGIS를 얹은 이미지라 PostgreSQL 메이저 버전과 libc(musl)가
    # 같다. 그래서 기존 데이터 볼륨을 그대로 쓴다. Debian 기반(17-3.5)으로 바꾸면 libc가 glibc로
    # 바뀌어 문자열 정렬 규칙이 달라지고, 텍스트 인덱스가 조용히 어긋날 수 있다. -alpine을 유지할 것.
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-earth}
      POSTGRES_USER: ${DB_USERNAME:-earth}
      # 기본값을 두지 않는다. .env에 없으면 기동 자체를 실패시켜서,
      # 약한 기본 비밀번호로 조용히 떠 있는 상황을 막는다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정해야 한다}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 127.0.0.1에만 묶는다. 집 LAN에도 인터넷에도 노출되지 않고, 서버 내부에서만 보인다.
    # PC의 GUI 도구(DBeaver 등)로 볼 때는 SSH 터널을 경유한다:
    #   ssh -L 15432:localhost:5432 jhin@192.168.0.11   →  localhost:15432로 접속
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-earth} -d ${DB_NAME:-earth}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 리프레시 토큰 회전 상태가 Redis에 있다. 재시작했다고 전원이 로그아웃되면 곤란하므로
    # AOF로 디스크에 남긴다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m

  earth-backend:
    # 평소 배포는 GitHub Actions가 올려둔 이미지를 홈서버가 당겨서 쓴다.
    #   docker compose pull && docker compose up -d
    # 로컬에서 직접 만들어 시험하고 싶으면 --build를 붙이면 이 태그로 빌드된다.
    #   docker compose up -d --build
    image: ghcr.io/jhinslog/earth-backend:${EARTH_IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      # 단순 depends_on은 "컨테이너가 떴다"까지만 본다. Flyway가 DB에 붙어야 하므로
      # 실제 접속 가능한 상태(healthy)까지 기다린다.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-earth}
      DB_USERNAME: ${DB_USERNAME:-earth}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정해야 한다}
      # application.yml은 redis 호스트가 localhost로 박혀 있다. 컨테이너에서는 서비스명으로 붙는다.
      SPRING_DATA_REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?구글 OAuth 클라이언트 ID가 필요하다}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?구글 OAuth 시크릿이 필요하다}
      JWT_SECRET: ${JWT_SECRET:?JWT 서명 키가 필요하다}
      # 서울시 실시간 돌발정보(서울 열린데이터광장) 인증키. 없으면 백엔드가 뜨지 않는다(기본값 없음).
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:?서울 열린데이터 인증키가 필요하다}
      # 프론트는 다른 오리진(Pages)에 있다. CORS 허용 대상이자 OAuth 성공 후 돌아갈 곳이다.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?프론트엔드 주소가 필요하다}
      OAUTH_REDIRECT_URL: ${FRONTEND_ORIGIN}/oauth2/redirect
      # TLS가 Cloudflare 엣지에서 끝나고 여기까지는 평문으로 온다.
      # 이걸 켜야 Spring이 X-Forwarded-Proto를 신뢰해 OAuth 콜백 URL을 https로 만든다.
      # 빠뜨리면 구글이 redirect_uri_mismatch로 로그인을 거부한다.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # 127.0.0.1에만 묶는다. 집 LAN 전체에 노출되지 않고, 호스트의 cloudflared만 여기로 붙는다.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 1g

  # ── 모니터링 ───────────────────────────────────────────────────────────────
  # 백엔드가 관리 포트(8081)의 /actuator/prometheus로 내놓는 수치를 Prometheus가 15초마다 긁어 저장하고,
  # Grafana가 그래프로 보여 준다. 8081은 publish하지 않는다 — 이 docker 네트워크 안에서만 닿는다.
  # 이 스택은 서버와 같이 죽으므로, 서버째 꺼진 것은 바깥의 업타임 체크(.github/workflows/uptime.yml)가 맡는다.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 디스크가 조용히 차지 않게 기간과 크기 둘 다 건다. 먼저 닿는 쪽에서 오래된 것부터 지운다.
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # 포트를 열지 않는다. Grafana만 내부망으로 붙는다.
    mem_limit: 256m

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # 폴백 기본값을 두지 않는다. 비어 있으면 Grafana 기본 비밀번호(admin)로 뜬다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Grafana 관리자 비밀번호를 .env에 지정해야 한다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Cloudflare Tunnel로 들어오는 주소. 리다이렉트·알림 링크를 이 주소로 만든다.
      GF_SERVER_ROOT_URL: https://earth-grafana.jhinslog.com
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # 127.0.0.1에만 묶는다. 바깥에서는 Cloudflare Tunnel(earth-grafana.jhinslog.com)로만 들어오고, 그 앞에
    # Cloudflare Access가 지정한 메일 주소만 통과시킨다. Grafana 로그인은 그 뒤의 두 번째 관문이다 —
    # Grafana 자체 로그인만 믿고 인터넷에 열면 Grafana 취약점이 곧 서버 침입 경로가 된다.
    # 터널이 안 될 때는 SSH 포트 포워딩으로도 볼 수 있다.
    #   ssh -L 3000:127.0.0.1:3000 jhin@jhinslog   →   http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:
