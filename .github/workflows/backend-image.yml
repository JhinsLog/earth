# 백엔드 컨테이너 이미지를 빌드해 GitHub Container Registry(ghcr.io)에 올린다.
#
# 홈서버로 배포를 "밀어넣지" 않는다는 점이 중요하다. 이 워크플로는 이미지를 올리기만 하고,
# 홈서버가 스스로 주기적으로 확인해서 새 이미지를 당겨간다.
# 그래서 GitHub 쪽에 홈서버 접속 정보(SSH 키 등)를 저장할 필요가 없고,
# 워크플로가 탈취되더라도 홈서버에 닿을 수단이 존재하지 않는다.
#
# self-hosted 러너는 쓰지 않는다 — 이 저장소가 공개라, 포크에서 올린 PR의 코드가
# 홈서버에서 실행될 수 있기 때문이다(GitHub 공식 권고).
name: 백엔드 이미지 빌드

on:
  push:
    branches: [main]
    # 백엔드와 무관한 커밋(프론트 수정 등)으로는 돌지 않게 한다.
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  # 코드 변경 없이 다시 밀어야 할 때를 위해 수동 실행도 열어둔다.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # ghcr.io 경로는 소문자만 허용한다(계정명 JhinsLog 그대로 쓰면 거부된다).
  IMAGE: ghcr.io/jhinslog/earth-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 25 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 준비 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: jar 빌드
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: ghcr.io 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 워크플로 실행 중에만 유효한 임시 토큰이다. 별도로 만들어 저장한 시크릿이 아니다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # 레이어 캐시를 GitHub Actions 캐시에 둬서 재빌드를 빠르게 한다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 결과 요약
        run: |
          echo "### 이미지 푸시 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "홈서버가 몇 분 안에 스스로 이 이미지를 당겨가 교체한다." >> $GITHUB_STEP_SUMMARY
