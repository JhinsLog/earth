services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-earth}
      POSTGRES_USER: ${DB_USERNAME:-earth}
      # 로컬 개발용 기본값. 외부에 노출되는 DB라면 .env의 DB_PASSWORD로 반드시 덮어쓸 것.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-earth}
    ports:
      - "5432:5432"
    volumes:
      - earth_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  earth_pg_data:
