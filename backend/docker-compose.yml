services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: earth
      POSTGRES_USER: earth
      POSTGRES_PASSWORD: earth
    ports:
      - "5432:5432"
    volumes:
      - earth_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  earth_pg_data:
