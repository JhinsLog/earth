spring:
  # `cp .env.example .env` 로 만든 파일을 실제로 읽어들인다.
  # 없으면 무시되고 아래 기본값이 쓰인다(optional:).
  config:
    import: optional:file:.env[.properties]

  application:
    name: earth-backend

  datasource:
    # 기본값은 docker-compose로 띄우는 로컬 DB 기준이다. 운영에서는 환경변수로 덮어쓴다.
    # 오버라이드 통로가 없으면 운영 접속 정보를 넣으려고 이 파일을 고치게 되고,
    # 그 과정에서 실제 비밀번호가 저장소에 커밋된다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/earth}
    username: ${DB_USERNAME:earth}
    password: ${DB_PASSWORD:earth}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            # 계정을 구별할 ID(sub)만 받는다. email·profile을 요청하지 않으므로 구글 동의 화면에도 이름·이메일·사진
            # 항목이 나오지 않는다. userinfo API도 부르지 않는다(EarthOidcUserService, D-16).
            scope:
              - openid

earth:
  cors:
    # 쉼표로 여러 개 지정할 수 있다. 폰에서 접속해 GPS를 확인하려면 LAN IP도 필요하다.
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    # 폴백 기본값을 절대 두지 않는다. 공개 저장소에 올라간 문자열로 서명하게 되면
    # 그 줄을 읽은 누구나 임의의 userId로 토큰을 위조할 수 있다.
    # 값이 없으면 JwtTokenProvider가 기동 단계에서 즉시 실패시킨다.
    secret: ${JWT_SECRET:}
    access-token-validity-ms: 3600000        # 1h
    refresh-token-validity-ms: 1209600000    # 14d
  oauth2:
    redirect-url: ${OAUTH_REDIRECT_URL:http://localhost:5173/oauth2/redirect}
  geo:
    # 접속 국가(ISO 3166-1 alpha-2)가 담긴 헤더. Cloudflare가 엣지에서 붙인다.
    # Cloudflare Tunnel 뒤에서만 신뢰할 수 있다 — 직접 노출하면 클라이언트가 위조할 수 있다.
    country-header: CF-IPCountry
  chat:
    min-level-to-join: 1   # 상세 레벨 정책 확정 전까지는 로그인만 되어 있으면 입장 가능
    max-per-minute: 20     # 한 사용자가 1분 안에 보낼 수 있는 메시지 수 (도배 방지)
    max-same-content: 2    # 같은 내용은 이 횟수까지. 세 번째부터 거절 (반복 도배 방지)
    same-content-window-minutes: 10
  flare:
    # 플레어 수명. 현재 30분은 임시 정책이며, 레벨/EXP 정책이 확정되면 레벨별로
    # 달라질 수 있어 설정으로 분리해 둔다.
    ttl-minutes: 30
    max-per-hour: 5        # 한 사용자가 1시간 안에 등록할 수 있는 플레어 개수
    confirm-extension-minutes: 5   # 공감 1건이 늘려주는 수명
    max-lifetime-hours: 12         # 공감이 쌓여도 넘지 못하는 상한(생성 시각 기준)
    # 만료된 플레어를 정리하고 실시간으로 알리는 주기. 조회는 이미 expires_at으로
    # 걸러지므로 이 값이 커도 만료된 플레어가 보이지는 않는다.
    expiration-scan-interval-ms: 30000
  exp:
    # 경험치 정산(D-21). 사용자 플레어가 끝나면(만료·삭제) 사실 확인 수로 작성자 경험치를 한 번 정산한다.
    settlement-enabled: true
    settlement-interval-ms: 60000
    # "나도 봤어요" 3명마다 5점, 플레어 하나에 최대 10단계(50점). 1명당 1점처럼 단순하면 점수를 짐작해 맞추기 쉽다.
    seen-per-step: 3
    points-per-step: 5
    max-steps-per-flare: 10
    # "사실과 달라요"가 3명 이상이고 "나도 봤어요"보다 많을 때만 3명마다 5점을 뺀다(그때는 더하지 않는다). "끝났어요"는 영향 없음.
    disputed-min: 3
    disputed-per-step: 3
    penalty-per-step: 5
  incidents:
    seoul:
      # 서울시 실시간 돌발정보 → 플레어. 출처·이용조건은 docs/data-sources.md
      enabled: true
      # 폴백 기본값을 두지 않는다. 켜져 있는데 비어 있으면 SeoulIncidentScheduler가 기동을 막는다.
      api-key: ${SEOUL_OPENAPI_KEY:}
      refresh-interval-ms: 600000
  ski:
    # 스키장 개장 정보(resources/ski/season.json) → 플레어. 날짜는 공식 발표만, 출처와 함께 사람이 적는다.
    # 외부 호출이 없어 키가 필요 없다. 날짜가 바뀌는 것을 따라가기만 하면 되므로 1시간마다.
    enabled: true
    refresh-interval-ms: 3600000
  events:
    paris:
      # 파리시 「Que faire à Paris ?」(ODbL) → 장소별 레저/행사 플레어. 인증키 없음. 출처·조건은 docs/data-sources.md
      enabled: true
      refresh-interval-ms: 3600000
      # 파리 하나가 하루 180곳 넘게 나온다. 지구본은 한 번에 최대 500개라 행사가 많은 장소부터 60곳만.
      max-venues: 60
  quakes:
    kma:
      # 기상청 지진정보(공공데이터포털 15000420) → 지구본의 지진 표시. 플레어와 따로 둔다. 출처는 docs/data-sources.md
      enabled: true
      # 폴백 기본값을 두지 않는다. 켜져 있는데 비어 있으면 KmaQuakeScheduler가 기동을 막는다.
      api-key: ${KMA_OPENAPI_KEY:}
      # 1분마다. 하루 1,440회로 API 일일 한도(10,000)의 15% 안쪽이다.
      refresh-interval-ms: 60000
      # 진앙시로부터 이만큼만 지구본에 보인다. 모든 지진에 같은 기간(지진별 '영향 기간'은 기상청 발표가 아니라 정하지 않는다).
      display-hours: 24
    usgs:
      # 미국 지질조사국 지진 피드(키 없음, 퍼블릭 도메인). 한반도 인근은 쓰지 않고, 기상청과 같은 지진이면 기상청 것을 쓴다(D-18).
      enabled: true
      refresh-interval-ms: 120000
  logs:
    # Loki 수신 주소. prod 프로파일의 logback-spring.xml만 읽는다. 로컬·테스트에서는 비어 있어도 된다.
    loki-url: ${LOKI_URL:}
    client-events-per-minute: 30
    max-body-bytes: 65536
  clouds:
    # 홈 라스 실시간 구름(NOAA GMGSI). 출처는 docs/data-sources.md
    enabled: true
    # 위성 다섯 기 직접 합성(10분). GMGSI(1시간)는 빈 지역을 채우는 바탕으로 같이 받는다. 새 영상일 때만 받는다.
    refresh-interval-ms: 600000
    ring-enabled: true

springdoc:
  # 운영에서는 API 명세 전체가 외부에 공개되지 않도록 기본적으로 끈다.
  # 엔드포인트 목록/파라미터/에러 코드는 공격자에게 그대로 지도가 된다.
  # 로컬 개발에서는 application-local.yml이 다시 켠다.
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /v3/api-docs

management:
  server:
    # 수치(/actuator/prometheus)는 요청 수·응답 시간·JVM 상태를 그대로 드러내므로 공개 포트(8080)에 두지 않는다.
    # 8080은 Cloudflare Tunnel이 외부에 여는 포트이고, 이 포트는 compose에서 publish하지 않아 같은 docker
    # 네트워크의 Prometheus만 닿는다. 그 대신 /actuator/health도 같이 8081로 옮겨 가므로, 공개 포트의 같은 경로는
    # PublicHealthController가 이어서 맡는다.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # 응답 시간 분포를 버킷으로 내보내야 Prometheus에서 p95·p99를 계산할 수 있다(평균만으로는 꼬리 지연이 안 보인다).
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.hibernate.SQL: warn
