spring:
  # `cp .env.example .env` 로 만든 파일을 실제로 읽어들인다.
  # 없으면 무시되고 아래 기본값이 쓰인다(optional:).
  config:
    import: optional:file:.env[.properties]

  application:
    name: earth-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/earth
    username: earth
    password: earth
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

earth:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-validity-ms: 3600000        # 1h
    refresh-token-validity-ms: 1209600000    # 14d
  oauth2:
    redirect-url: ${OAUTH_REDIRECT_URL:http://localhost:5173/oauth2/redirect}
  chat:
    min-level-to-join: 1   # 상세 레벨 정책 확정 전까지는 로그인만 되어 있으면 입장 가능
  event:
    # 별 수명. 현재 30분은 임시 정책이며, 레벨/EXP 정책이 확정되면 레벨별로
    # 달라질 수 있어 설정으로 분리해 둔다.
    ttl-minutes: 30
    # 만료된 별을 정리하고 실시간으로 알리는 주기. 조회는 이미 expires_at으로
    # 걸러지므로 이 값이 커도 만료된 별이 보이지는 않는다.
    expiration-scan-interval-ms: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: warn
